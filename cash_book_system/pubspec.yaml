name: cash_book_system
description: "A complete, production-grade Cash Book Management System for Android, Windows, iOS, and macOS."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  provider: ^6.1.2

  # Firebase Ecosystem
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2

  # Local Database (Offline-First)
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  path_provider: ^2.1.4
  path: ^1.9.0

  # Financial Precision, Formatting & Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  crypto: ^3.0.5

  # Professional Charts & Visualization
  fl_chart: ^0.69.0

  # Reports, Exports & Printing
  excel: ^4.0.6
  pdf: ^3.11.1
  printing: ^5.13.2
  csv: ^6.0.0

  # Local Preferences & State
  shared_preferences: ^2.3.2

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

