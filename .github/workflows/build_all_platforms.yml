name: Build Multi-Platform Releases (Android APK, Windows EXE, iOS IPA)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradle
        run: chmod +x gradlew || true

      - name: Assemble Android APK
        run: gradle assembleDebug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShivayCashBook-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk

  build-windows-exe:
    name: Build Windows PC Installer (.exe) with Inno Setup
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Inno Setup
        uses: bactun/inno-setup-action@v1
        with:
          path: installer/shivay_cashbook_inno_setup.iss

      - name: Upload Windows Setup .exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShivayCashBook-Windows-Setup-EXE
          path: installer/output/*.exe

  build-ios-ipa:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run iOS IPA Packaging Script
        run: |
          chmod +x scripts/build_ios_ipa.sh
          ./scripts/build_ios_ipa.sh

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShivayCashBook-iOS-IPA
          path: build/ios/ipa/ShivayCashBook.ipa
